when:
  - event: push
    branch: main

steps:
  - name: build
    image: golang:1.25
    commands:
      - CGO_ENABLED=0 go build -ldflags="-w -s" -o gold-price-api ./cmd/api/main.go

  - name: deploy
    image: docker:27-cli
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/admin/goldprice-bot:/home/admin/goldprice-bot
    commands:
      - cp /home/admin/goldprice-bot/.env ./.env
      - docker compose build
      - docker compose up -d --remove-orphans
