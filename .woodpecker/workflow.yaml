when:
  - event: push
    branch: main

steps:
  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/admin/goldprice-bot:/home/admin/goldprice-bot
    commands:
      - cp /home/admin/goldprice-bot/.env ./.env
      - docker compose build
      - docker compose up -d --remove-orphans
