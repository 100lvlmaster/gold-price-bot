name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=1 go build -ldflags="-w -s" -o gold-price-api ./cmd/api/main.go

      - name: Install binary and service
        run: |
          install -Dm755 gold-price-api /var/www/goldprice-bot/gold-price-api
          install -Dm644 services/goldprice-bot.service /etc/systemd/system/goldprice-bot.service
          systemctl daemon-reload
          systemctl enable --now goldprice-bot.service
          systemctl restart goldprice-bot.service
